<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Planner</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#222">

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* Light / Dark Mode */
:root {
  --bg: #ffffff;
  --text: #000000;
  --panel: #f5f5f5;
  --border: #cccccc;
}
.dark {
  --bg: #1e1e1e;
  --text: #ffffff;
  --panel: #2a2a2a;
  --border: #555;
}

/* Layout */
.container {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.left-panel {
  width: 20%;
  border-right: 2px solid var(--border);
  padding: 15px;
  background: var(--panel);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
  box-sizing: border-box;
}

.left-panel > div:first-child {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.middle-panel {
  width: 30%;
  border-right: 2px solid var(--border);
  padding: 15px;
  background: var(--panel);
  overflow: hidden;
  display: none;
  flex-shrink: 0;
  height: 100vh;
  box-sizing: border-box;
  flex-direction: column;
}

#taskList {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.right-panel {
  width: 50%;
  padding: 15px;
  background: var(--panel);
  overflow: hidden;
  display: none;
  flex-shrink: 0;
  height: 100vh;
  box-sizing: border-box;
  flex-direction: column;
}

#taskDetail {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

/* Back button (mobile only) */
.back-btn {
  display: none;
}

/* ── iPad Portrait (768px - 1024px) ── */
@media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
  .container { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }

  .left-panel {
    width: 100%; height: auto; overflow: visible;
    border-right: none; border-bottom: 2px solid var(--border);
    box-sizing: border-box; padding: 12px;
  }
  .left-panel > div:first-child { overflow: visible; }

  .middle-panel {
    width: 100%; height: auto; overflow: visible;
    border-right: none; border-bottom: 2px solid var(--border);
    box-sizing: border-box; display: block !important;
  }
  #taskList { overflow: visible; flex: unset; }

  .right-panel { display: none !important; }

  .day { padding: 8px 2px; font-size: 13px; }
  .header-day { font-size: 11px; }
}

/* ── iPad Landscape ── */
@media (min-width: 768px) and (max-width: 1366px) and (orientation: landscape) {
  .container {
    display: flex; flex-direction: row;
    height: 100vh; overflow: hidden;
  }

  /* Calendar — left */
  .left-panel {
    width: 42%; height: 100vh;
    overflow: hidden; padding: 12px;
    border-right: 2px solid var(--border);
    box-sizing: border-box;
    display: flex; flex-direction: column;
  }
  .left-panel > div:first-child { overflow-y: auto; flex: 1; min-height: 0; }

  /* Task List — right (replaces right-panel role) */
  .middle-panel {
    flex: 1; height: 100vh;
    overflow: hidden;
    border-right: none;
    box-sizing: border-box;
    display: flex !important;
    flex-direction: column;
  }

  /* Hide original right-panel on iPad landscape */
  .right-panel { display: none !important; }

  .left-panel .grid { gap: 2px; width: 100%; box-sizing: border-box; }
  .left-panel .day { padding: 6px 0; font-size: 13px; min-width: 0; overflow: hidden; box-sizing: border-box; }
  .left-panel .header-day { font-size: 11px; padding: 2px 0; }
  .left-panel h2 { font-size: 15px; margin: 4px 0; }
  .left-panel h3 { font-size: 13px; margin: 2px 0; }
  .left-panel button { font-size: 13px; padding: 7px 4px; }
}

/* ── iPhone Portrait (max 767px) ── */
@media (max-width: 767px) and (orientation: portrait) {
  .container { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }

  .left-panel {
    width: 100%; height: auto; overflow: visible;
    border-right: none; border-bottom: 2px solid var(--border);
    box-sizing: border-box; padding: 12px;
  }
  .left-panel > div:first-child { overflow: visible; }

  .middle-panel {
    width: 100%; height: auto; overflow: visible;
    border-right: none; border-bottom: 2px solid var(--border);
    box-sizing: border-box; display: block !important;
  }
  #taskList { overflow: visible; flex: unset; }

  .right-panel { display: none !important; }
  .back-btn { display: none !important; }

  .day { padding: 8px 2px; font-size: 14px; }
  .header-day { font-size: 12px; }
  .grid { gap: 3px; }
  button { font-size: 15px; padding: 12px; }
}

/* ── iPhone Landscape ── */
@media (max-width: 767px) and (orientation: landscape) {
  .container {
    display: flex; flex-direction: row;
    height: 100vh; overflow: hidden;
  }

  .left-panel {
    width: 45%; height: 100vh;
    overflow: hidden; padding: 10px;
    border-right: 2px solid var(--border);
    box-sizing: border-box;
    display: flex; flex-direction: column;
  }
  .left-panel > div:first-child { overflow-y: auto; flex: 1; min-height: 0; }

  .middle-panel {
    flex: 1; height: 100vh;
    overflow: hidden;
    border-right: none;
    box-sizing: border-box;
    display: flex !important;
    flex-direction: column;
  }

  .right-panel { display: none !important; }
  .back-btn { display: none !important; }

  .left-panel .grid { gap: 2px; width: 100%; box-sizing: border-box; }
  .left-panel .day { padding: 4px 0; font-size: 11px; min-width: 0; overflow: hidden; box-sizing: border-box; }
  .left-panel .header-day { font-size: 9px; padding: 1px 0; }
  .left-panel h2 { font-size: 13px; margin: 2px 0; }
  .left-panel h3 { font-size: 11px; margin: 1px 0; }
  .left-panel button { font-size: 11px; padding: 5px 3px; }
}

/* Calendar */
.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.day {
  padding: 10px;
  border: 1px solid var(--border);
  text-align: center;
  cursor: pointer;
  position: relative;
}
.day.has-task {
  background: none;
}
.day.has-task::after {
  content: "";
  position: absolute;
  top: 3px;
  right: 3px;
  width: 7px;
  height: 7px;
  background: #f5c400;
  border-radius: 50%;
}
.day.today {
  border: 2px solid #4da3ff;
  font-weight: bold;
}
.dark .day.today {
  border: 2px solid #66b8ff;
}
.day.selected {
  background: #4da3ff !important;
  color: white;
  border: 2px solid #1e6fd9;
  font-weight: bold;
}
.dark .day.selected {
  background: #005bbb !important;
  border-color: #003f7f;
}
.header-day {
  font-weight: bold;
  text-align: center;
  padding: 5px;
}

/* Task List */
.task-item {
  padding: 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.task-item:hover {
  background: #ddd;
}

.priority-high { color: red; font-weight: bold; }
.priority-med { color: orange; font-weight: bold; }
.priority-low { color: green; font-weight: bold; }

/* Popup */
#taskPopup, #confirmPopup {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
.popupBox {
  width: 90%;
  max-width: 500px;
  background: var(--panel);
  color: var(--text);
  padding: 20px;
  border-radius: 10px;
}
input, textarea, select {
  width: 100%;
  padding: 8px;
  margin: 5px 0;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}
button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div>
      <h2 id="title"></h2>
      <h3 id="weekNumber"></h3>

      <!-- Month Navigation -->
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <button onclick="prevMonth()" style="flex:1;">◀</button>
        <button onclick="nextMonth()" style="flex:1;">▶</button>
      </div>

      <div id="calendarHeader" class="grid"></div>
      <div id="calendar" class="grid"></div>
    </div>

    <button id="themeToggle"
      onclick="toggleDarkMode()"
      style="
        margin-top: auto;
        background: var(--border);
        color: var(--text);
        border: none;
        border-radius: 6px;
        font-size: 16px;
      ">
      Dark Mode
    </button>
  </div>

  <!-- MIDDLE PANEL -->
  <div class="middle-panel" id="taskListPanel">
    <button class="back-btn" onclick="goBackToCalendar()">◀ ปฏิทิน</button>
    <h2 id="taskListDate"></h2>

    <button onclick="openAddTaskForm()">+ เพิ่มงานใหม่</button>

    <div id="taskList"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel" id="taskDetailPanel">
    <button class="back-btn" onclick="goBackToTaskList()">◀ รายการงาน</button>
    <h2>รายละเอียดงาน</h2>
    <div id="taskDetail"></div>
  </div>

</div>

<!-- TASK DETAIL POPUP (mobile/tablet) -->
<div id="taskDetailPopup" style="
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
">
  <div class="popupBox" style="max-width: 520px; max-height: 80vh; overflow-y: auto; position: relative;">
    <button onclick="closeTaskDetailPopup()" style="
      position: absolute; top: 10px; right: 10px;
      width: auto; padding: 6px 14px; margin: 0;
      background: var(--border); border: none;
      border-radius: 6px; cursor: pointer;
      font-size: 14px; color: var(--text);
    ">✕ ปิด</button>
    <div id="taskDetailPopupContent"></div>
  </div>
</div>
<div id="taskPopup">
  <div class="popupBox">
    <h2 id="popupTitle">เพิ่มงานใหม่</h2>

    <label>ชื่องาน</label>
    <input id="p_title">

    <label>เวลาเริ่ม</label>
    <input id="p_start" placeholder="09:00">

    <label>เวลาจบ</label>
    <input id="p_end" placeholder="11:00">

    <label>Priority</label>
    <select id="p_priority">
      <option>Low</option>
      <option>Med</option>
      <option>High</option>
    </select>

    <label>หมวดหมู่</label>
    <input id="p_category">

    <label>ทำงานร่วมกับ</label>
    <input id="p_partner">

    <label>รายละเอียดงาน</label>
    <textarea id="p_detail"></textarea>

    <button onclick="savePopupTask()">บันทึก</button>
    <button onclick="closePopup()">ยกเลิก</button>
  </div>
</div>

<!-- CONFIRM DELETE POPUP -->
<div id="confirmPopup">
  <div class="popupBox">
    <h2>ยืนยันการลบ</h2>
    <p>คุณต้องการลบงานนี้หรือไม่?</p>

    <button onclick="deleteOneTask()" style="background:red; color:white;">
      ลบข้อมูล
    </button>

    <button onclick="cancelDeletePopup()">
      ยกเลิก
    </button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ttxmzaceymhykctqsnyn.supabase.co";
const SUPABASE_KEY = "sb_publishable_vaR-wqk9uJblFRYOpigYew_94uVfOp_";

// Supabase REST helper
async function sbFetch(method, path, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": method === "POST" ? "return=representation" : ""
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// tasks cache: { "2026-5-17": [ {id, title, start, end, ...}, ... ] }
let tasks = {};
let selectedDate = null;
let selectedTaskIndex = null;
let popupMode = "add";
let editIndex = null;
let selectedForDelete = [];
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let selectedCalendarDay = null;

/* LOAD ALL TASKS FROM SUPABASE */
async function loadTasks() {
  const rows = await sbFetch("GET", "tasks?select=*&order=start_time.asc");
  tasks = {};
  rows.forEach(r => {
    if (!tasks[r.date]) tasks[r.date] = [];
    tasks[r.date].push({
      id: r.id,
      title: r.title,
      start: r.start_time,
      end: r.end_time,
      priority: r.priority,
      category: r.category,
      detail: r.detail,
      partner: r.partner,
      done: r.done
    });
  });
}

/* DARK MODE */
function toggleDarkMode() {
  const body = document.body;
  const btn = document.getElementById("themeToggle");
  body.classList.toggle("dark");
  const isDark = body.classList.contains("dark");
  localStorage.setItem("darkMode", isDark);
  btn.innerText = isDark ? "Light Mode" : "Dark Mode";
}

window.onload = async () => {
  const isDark = localStorage.getItem("darkMode") === "true";
  const btn = document.getElementById("themeToggle");
  if (isDark) {
    document.body.classList.add("dark");
    btn.innerText = "Light Mode";
  } else {
    btn.innerText = "Dark Mode";
  }

  try {
    await loadTasks();
  } catch(e) {
    console.error("Load tasks error:", e);
  }

  loadCalendar();

  const today = new Date();
  const todayStr = `${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
  openTaskList(todayStr);
};

/* WEEK NUMBER */
function getWeekNumber(date) {
  const temp = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = temp.getUTCDay() || 7;
  temp.setUTCDate(temp.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(temp.getUTCFullYear(), 0, 1));
  return Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
}

/* LOAD CALENDAR */
function loadCalendar() {
  const year = currentYear;
  const month = currentMonth;

  document.getElementById("title").innerText =
    new Date(year, month).toLocaleString("th-TH", { month: "long", year: "numeric" });
  document.getElementById("weekNumber").innerText =
    "Week " + getWeekNumber(new Date(year, month, 1));

  const header = document.getElementById("calendarHeader");
  header.innerHTML = "";
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d => {
    const div = document.createElement("div");
    div.className = "header-day";
    div.innerText = d;
    header.appendChild(div);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const offset = (firstDay + 6) % 7;
  for (let i = 0; i < offset; i++) cal.appendChild(document.createElement("div"));

  const todayObj = new Date();
  const todayStr = `${todayObj.getFullYear()}-${todayObj.getMonth()+1}-${todayObj.getDate()}`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${month+1}-${d}`;
    const div = document.createElement("div");
    div.className = "day";
    if (tasks[dateStr]) div.classList.add("has-task");
    if (dateStr === todayStr) div.classList.add("today");
    div.innerText = d;
    div.dataset.date = dateStr;
    div.onclick = () => openTaskList(dateStr);
    if (selectedDate === dateStr) {
      div.classList.add("selected");
      selectedCalendarDay = div;
    }
    cal.appendChild(div);
  }
}

/* MONTH NAVIGATION */
function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  loadCalendar();
}
function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  loadCalendar();
}

/* OPEN TASK LIST */
function openTaskList(dateStr) {
  selectedDate = dateStr;
  selectedForDelete = [];

  if (selectedCalendarDay) selectedCalendarDay.classList.remove("selected");

  document.querySelectorAll(".day").forEach(d => {
    if (d.dataset.date === dateStr) {
      d.classList.add("selected");
      selectedCalendarDay = d;
    }
  });

  document.getElementById("taskListPanel").style.display = "flex";
  document.getElementById("taskDetailPanel").style.display = "none";
  document.getElementById("taskListDate").innerText = dateStr;
  renderTaskList();

  if (window.matchMedia("(orientation: portrait)").matches && window.innerWidth <= 1024) {
    setTimeout(() => {
      document.getElementById("taskListPanel").scrollIntoView({ behavior: "smooth" });
    }, 50);
  }
}

function goBackToCalendar() {}
function goBackToTaskList() {}

/* RENDER TASK LIST */
function renderTaskList() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";
  const tasksToday = tasks[selectedDate] || [];

  tasksToday.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "task-item";
    const isChecked = selectedForDelete.includes(i);

    div.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <input type="checkbox" onchange="toggleSelect(${i}); event.stopPropagation();"
          onclick="event.stopPropagation();"
          ${isChecked ? "checked" : ""}
          style="width:18px; height:18px; cursor:pointer; flex-shrink:0; margin:0;">
        <strong>${t.title}</strong>
        <span class="priority-${t.priority.toLowerCase()}">(${t.priority})</span>
        <span style="margin-left:auto; opacity:0.7; font-size:0.9em;">${t.start} - ${t.end}</span>
        <div style="display:flex; flex-direction:column; gap:4px;">
          <button onclick="editTask('${selectedDate}', ${i}); event.stopPropagation();"
            style="width:auto; padding:4px 10px; margin:0;">แก้ไข</button>
          ${isChecked ? `
          <button onclick="confirmDeleteOne(${i}); event.stopPropagation();"
            style="width:auto; padding:4px 10px; margin:0; background:red; color:white; border:none; cursor:pointer; border-radius:4px;">ลบ</button>` : ""}
        </div>
      </div>
      <div style="padding-left:26px; font-size:0.9em; opacity:0.8; margin-top:2px;">👥 ${t.partner}</div>
    `;
    div.onclick = () => openTaskDetail(i);
    list.appendChild(div);
  });
}

/* SELECT FOR DELETE */
function toggleSelect(index) {
  if (selectedForDelete.includes(index)) {
    selectedForDelete = selectedForDelete.filter(i => i !== index);
  } else {
    selectedForDelete.push(index);
  }
  renderTaskList();
}

/* CONFIRM DELETE */
let deleteTargetIndex = null;

function confirmDeleteOne(index) {
  deleteTargetIndex = index;
  document.getElementById("confirmPopup").style.display = "flex";
}

function cancelDeletePopup() {
  deleteTargetIndex = null;
  selectedForDelete = [];
  document.getElementById("confirmPopup").style.display = "none";
  renderTaskList();
}

async function deleteOneTask() {
  if (deleteTargetIndex === null) return;
  const t = tasks[selectedDate][deleteTargetIndex];

  try {
    await sbFetch("DELETE", `tasks?id=eq.${t.id}`);
    tasks[selectedDate].splice(deleteTargetIndex, 1);
    if (tasks[selectedDate].length === 0) delete tasks[selectedDate];
  } catch(e) {
    console.error("Delete error:", e);
    alert("ลบไม่สำเร็จ: " + e.message);
    return;
  }

  selectedForDelete = [];
  deleteTargetIndex = null;
  document.getElementById("confirmPopup").style.display = "none";
  loadCalendar();
  openTaskList(selectedDate);
}

/* OPEN DETAIL */
function openTaskDetail(index) {
  selectedTaskIndex = index;
  const t = tasks[selectedDate][index];

  const detailHTML = `
    <h3 style="margin-top:30px;">${t.title}</h3>
    <p><strong>เวลา:</strong> ${t.start} - ${t.end}</p>
    <p><strong>Priority:</strong> <span class="priority-${t.priority.toLowerCase()}">${t.priority}</span></p>
    <p><strong>หมวดหมู่:</strong> ${t.category}</p>
    <p><strong>ทำงานร่วมกับ:</strong> ${t.partner}</p>
    <p><strong>รายละเอียด:</strong><br>${t.detail}</p>
  `;

  if (window.innerWidth <= 1366 && !/Windows NT|Macintosh/.test(navigator.userAgent) || window.innerWidth <= 767) {
    document.getElementById("taskDetailPopupContent").innerHTML = detailHTML;
    document.getElementById("taskDetailPopup").style.display = "flex";
  } else {
    document.getElementById("taskDetailPanel").style.display = "flex";
    document.getElementById("taskDetail").innerHTML = detailHTML;
  }
}

function closeTaskDetailPopup() {
  document.getElementById("taskDetailPopup").style.display = "none";
}

/* ADD TASK FORM */
function openAddTaskForm() {
  popupMode = "add";
  editIndex = null;
  document.getElementById("popupTitle").innerText = "เพิ่มงานใหม่";
  document.getElementById("p_title").value = "";
  document.getElementById("p_start").value = "";
  document.getElementById("p_end").value = "";
  document.getElementById("p_priority").value = "Low";
  document.getElementById("p_category").value = "";
  document.getElementById("p_detail").value = "";
  document.getElementById("p_partner").value = "";
  document.getElementById("taskPopup").style.display = "flex";
}

/* EDIT TASK */
function editTask(dateStr, index) {
  popupMode = "edit";
  editIndex = index;
  const t = tasks[dateStr][index];
  document.getElementById("popupTitle").innerText = "แก้ไขงาน";
  document.getElementById("p_title").value = t.title;
  document.getElementById("p_start").value = t.start;
  document.getElementById("p_end").value = t.end;
  document.getElementById("p_priority").value = t.priority;
  document.getElementById("p_category").value = t.category;
  document.getElementById("p_detail").value = t.detail;
  document.getElementById("p_partner").value = t.partner;
  document.getElementById("taskPopup").style.display = "flex";
}

function closePopup() {
  document.getElementById("taskPopup").style.display = "none";
}

/* SAVE TASK */
async function savePopupTask() {
  const title    = document.getElementById("p_title").value.trim();
  const start    = document.getElementById("p_start").value;
  const end      = document.getElementById("p_end").value;
  const priority = document.getElementById("p_priority").value;
  const category = document.getElementById("p_category").value;
  const detail   = document.getElementById("p_detail").value;
  const partner  = document.getElementById("p_partner").value;

  if (!title) { alert("กรุณาใส่ชื่องาน"); return; }

  try {
    if (popupMode === "add") {
      const rows = await sbFetch("POST", "tasks", {
        date: selectedDate,
        title, start_time: start, end_time: end,
        priority, category, detail, partner, done: false
      });
      if (!tasks[selectedDate]) tasks[selectedDate] = [];
      const newRow = rows[0];
      tasks[selectedDate].push({
        id: newRow.id, title, start, end, priority, category, detail, partner, done: false
      });
    } else {
      const t = tasks[selectedDate][editIndex];
      await sbFetch("PATCH", `tasks?id=eq.${t.id}`, {
        title, start_time: start, end_time: end,
        priority, category, detail, partner
      });
      Object.assign(t, { title, start, end, priority, category, detail, partner });
    }
  } catch(e) {
    console.error("Save error:", e);
    alert("บันทึกไม่สำเร็จ: " + e.message);
    return;
  }

  closePopup();
  loadCalendar();
  openTaskList(selectedDate);
}

loadCalendar();
</script>

</body>
</html>
